volumes:
  gtd_data:
  gtd_uploads:

networks:
  pangolin:
    external: true

services:
  gtd:
    build: .
    networks:
      - pangolin
    env_file:
      # Copy from ./server/.env.example
      - ./.env
    volumes:
      - gtd_data:/app/server/data
      - gtd_uploads:/app/server/uploads
    restart: unless-stopped
